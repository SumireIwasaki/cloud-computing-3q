<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サインイン</title>
  </head>
  <body>
    <form id="form-sign-in" class="auth-card">
      <h1>サインイン</h1>
      <label>
        <span>メールアドレス</span>
        <input type="email" name="email" required />
      </label>
      <label>
        <span>パスワード</span>
        <input type="password" name="password" required />
      </label>
      <button type="submit">サインイン</button>
      <p class="link-area"><a href="signup.html">新規登録はこちら</a></p>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
