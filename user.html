<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント情報</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main class="container">
    <h1>アカウント情報</h1>

    <p>ログイン中のメールアドレス</p>
    <input type="email" id="user-email" readonly>

    <form id="form-sign-out">
      <button type="submit">サインアウト</button>
    </form>

    <hr>

    <h2>練習問題1：ユーザー検索</h2>
    <p>ドキュメントIDを入力してデータを取得します。</p>

    <form id="form-search-user">
      <input
        type="text"
        id="document-id"
        placeholder="例：user-1"
        required
      >
      <button type="submit">検索</button>
    </form>

    <div id="search-result"></div>

    <hr>

    <h2>練習問題2：ユーザー一覧</h2>
    <button type="button" id="load-users">全ユーザーを表示</button>

    <ul id="user-list"></ul>
  </main>

  <script type="module" src="/src/user.js"></script>
</body>
</html>
